<style>

:root{--f:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--e:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:48px}
body{font-family:var(--f);color:#1d1d1f;background:#fbfbfd;-webkit-font-smoothing:antialiased;line-height:1.47;overflow-x:hidden}
a{color:inherit;text-decoration:none}img{max-width:100%;display:block}
nav{box-shadow:0 1px 0 rgba(0,0,0,.08);position:fixed;inset:0 0 auto;height:48px;z-index:50;background:rgba(255,255,255,.78);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100% - 1024px)/2));color:#1d1d1f;font-size:12px}
nav .b{display:flex;align-items:center;gap:10px;font-weight:600}
nav .b img{width:26px;height:26px;border-radius:50%;background:#fff}
nav ul{display:flex;gap:30px;list-style:none}
nav ul a{opacity:.8;transition:opacity .3s}nav ul a:hover{opacity:1}
.lg{display:flex;gap:2px;background:rgba(0,0,0,.07);border-radius:99px;padding:2px}
.lg button{all:unset;cursor:pointer;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:600;transition:.3s}
.lg button.on{background:#1d1d1f;color:#fff}
section{padding:clamp(80px,12vw,150px) max(22px,calc((100% - 1080px)/2))}
.gy{background:#f5f5f7}.dk{background:#fff;color:#1d1d1f;--a:#e5322b}.wh{background:#f5f5f7;--a:#a43cd6}.gr{background:#eef4ec;--a:#1e6b3b}
.ey{font-size:clamp(14px,1.6vw,19px);font-weight:600;color:var(--a,#6e6e73);margin-bottom:12px}
h1,h2{font-size:clamp(36px,6.4vw,72px);font-weight:700;letter-spacing:-.035em;line-height:1.05}
.lead{font-size:clamp(18px,2.2vw,24px);color:#6e6e73;max-width:740px;margin-top:22px;line-height:1.4}.dk .lead{color:#6e6e73}
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:110px 22px 70px;background:radial-gradient(ellipse at 50% 0,#fff,#f0f2f5 70%)}
.hero>*{animation:up 1.3s var(--e) both}.hero>*:nth-child(2){animation-delay:.12s}.hero>*:nth-child(3){animation-delay:.24s}.hero>*:nth-child(4){animation-delay:.36s}.hero>*:nth-child(5){animation-delay:.48s}
.hero h1{padding-bottom:.14em;max-width:900px;background:linear-gradient(180deg,#1d1d1f 40%,#545458);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lead{margin-inline:auto}
.lw{transform:translateY(calc(var(--y,0)*1px));margin-bottom:34px}
.hl{border-radius:50%;width:clamp(150px,22vw,230px);mix-blend-mode:multiply;animation:fl 7s ease-in-out infinite}
@keyframes up{from{opacity:0;transform:translateY(40px);filter:blur(10px)}}
@keyframes fl{50%{transform:translateY(-14px) rotate(1.5deg)}}
.cta{display:flex;gap:28px;align-items:center;margin-top:38px;flex-wrap:wrap;justify-content:center}
.btn{background:#0071e3;color:#fff;padding:13px 26px;border-radius:99px;font-size:17px;font-weight:500;border:0;cursor:pointer;font-family:inherit;transition:transform .4s var(--e),background .3s}
.btn:hover{background:#0077ed;transform:scale(1.05)}
.ln{color:#0071e3;font-size:17px}.ln:hover{text-decoration:underline}
.g3,.g2,.g6{display:grid;gap:20px;margin-top:56px}
.g3{grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}.g6{grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin-top:20px}
.card{display:block;height:100%;background:#fff;border-radius:30px;padding:22px 22px 32px;transition:transform .5s var(--e),box-shadow .5s}
.card:hover{box-shadow:0 34px 60px -24px rgba(0,0,0,.3)}
.im{aspect-ratio:1;border-radius:20px;overflow:hidden;background:#fff;margin-bottom:24px}
.im img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--e)}.card:hover .im img{transform:scale(1.07)}
.card h3{font-size:24px;letter-spacing:-.02em;line-height:1.15}.card p{color:#6e6e73;margin-top:8px}
.mo{color:#0071e3;margin-top:16px;display:inline-block;transition:transform .4s var(--e)}.mo::after{content:" ›"}.card:hover .mo{transform:translateX(6px)}
.top{display:grid;grid-template-columns:1fr auto;gap:48px;align-items:center;margin-bottom:60px}
.top img{width:clamp(120px,18vw,210px);border-radius:26px}
.pc{border-radius:32px;padding:clamp(24px,4vw,48px);overflow:hidden;background:#f5f5f7;position:relative}
.wh .pc{background:#fff}.pc p{color:#6e6e73}
.vis{width:100%;height:auto;margin-bottom:28px;border-radius:20px;background:radial-gradient(circle at 50% 0,#fff,#e6eaf0)}
.pc h3{font-size:clamp(40px,6vw,72px);letter-spacing:-.04em;line-height:1}
.sub{color:var(--a);font-weight:600;margin:8px 0 18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.chips span{border:1px solid rgba(128,128,128,.4);border-radius:99px;padding:6px 15px;font-size:13px;background:linear-gradient(var(--a),var(--a)) no-repeat left/0 100%;transition:background-size .5s var(--e),color .4s,border-color .4s}
.chips span:hover{background-size:100% 100%;color:#fff;border-color:var(--a)}
.big{font-size:clamp(90px,15vw,180px);font-weight:800;letter-spacing:-.06em;line-height:.9;margin-bottom:14px;background:linear-gradient(100deg,#1d1d1f 20%,#a43cd6 50%,#1d1d1f 80%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 7s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.flag{background:linear-gradient(135deg,#0f4524,#1e6b3b 60%,#3f9a5c);color:#fff;border-radius:32px;padding:clamp(28px,5vw,64px);margin-top:56px;position:relative;overflow:hidden}
.flag::after{content:"";position:absolute;right:-80px;top:-80px;width:320px;height:320px;border-radius:50%;background:radial-gradient(#ffffff30,transparent 70%);animation:fl 9s ease-in-out infinite}
.flag h3{font-size:clamp(32px,5vw,56px);letter-spacing:-.03em;line-height:1.05}.flag p{max-width:680px;margin:16px 0 28px;opacity:.88;font-size:19px}
.flag a{background:#fff;color:#0f4524;padding:12px 24px;border-radius:99px;font-weight:600;display:inline-block;transition:transform .4s var(--e)}.flag a:hover{transform:scale(1.06)}
.tile{background:#fff;border-radius:26px;padding:30px;height:100%;transition:transform .5s var(--e),box-shadow .5s}
.tile:hover{transform:translateY(-8px);box-shadow:0 26px 50px -26px rgba(15,69,36,.5)}
.ic{width:36px;height:36px;color:var(--a);margin-bottom:22px;transition:transform .6s var(--e)}.tile:hover .ic{transform:rotate(-10deg) scale(1.15)}
.tile h4{font-size:21px;letter-spacing:-.02em}.tile p{color:#6e6e73;margin-top:6px}
.ct{background:#fff;color:#1d1d1f;text-align:center}.ct .lead{margin-inline:auto}
.fm{max-width:640px;margin:54px auto 0;display:grid;gap:14px;text-align:left}
input,textarea,select{font:inherit;width:100%;background:#f5f5f7;border:1px solid #d2d2d7;border-radius:14px;color:#1d1d1f;padding:16px 18px;transition:border-color .3s,box-shadow .3s}
textarea{min-height:150px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:0;border-color:#0071e3;box-shadow:0 0 0 4px rgba(0,113,227,.28)}
#st{min-height:24px;text-align:center;color:#6e6e73;font-size:15px}
footer{background:#f5f5f7;border-top:1px solid #d2d2d7;color:#6e6e73;font-size:12px;padding:34px max(22px,calc((100% - 1080px)/2));display:flex;gap:18px;align-items:center;flex-wrap:wrap}
footer img{width:38px;border-radius:50%;background:#fff}
.rv{opacity:0;transform:translateY(54px);filter:blur(8px);transition:opacity 1.1s var(--e) var(--d,0s),transform 1.1s var(--e) var(--d,0s),filter 1.1s var(--e) var(--d,0s)}
.rv.in{opacity:1;transform:none;filter:none}
.bob{animation:fl 6s ease-in-out infinite}
@media(max-width:820px){nav ul{display:none}.top{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none;filter:none}}

.vis{aspect-ratio:800/440;display:block}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em}
.w>span{display:inline-block;transform:translateY(112%);transition:transform 1.15s var(--e) var(--wd,0s)}
.in .w>span{transform:none}
h2.rv{opacity:1;transform:none;filter:none}
#pg{position:fixed;top:0;left:0;height:2px;width:100%;background:#0071e3;transform-origin:0 50%;transform:scaleX(0);z-index:60}

c1:["Turan Havacılık ve Bilişim Kulübü","Turan Luftfahrt- und Informatikclub","Turan Aviation & Informatics Club"],
c1p:["İnsansız hava araçları ve üretim teknolojileri. Projeler: CNC, Hera ve VTOL.","Drohnen und Fertigungstechnik. Projekte: CNC, Hera und VTOL.","Unmanned aircraft and manufacturing technology. Projects: CNC, Hera and VTOL."],
c2:["Demiröz Robotics","Demiröz Robotics","Demiröz Robotics"],c2p:["Yarışmalar için tasarlanan robotlar. VEX ve FRC.","Roboter für Wettbewerbe. VEX und FRC.","Robots built for competition. VEX and FRC."],
c3:["Agrotech","Agrotech","Agrotech"],c3p:["Tarım, teknoloji ve çevre odaklı sürdürülebilir projeler.","Nachhaltige Projekte für Landwirtschaft, Technik und Umwelt.","Sustainable projects in agriculture, technology and environment."],
more:["İncele","Mehr erfahren","Learn more"],
te:["Turan İHA Takımı","Turan UAV-Team","Turan UAV Team"],th:["Gökyüzü için tasarlıyoruz.","Wir konstruieren für den Himmel.","We engineer for the sky."],
tp:["Turan Havacılık ve Bilişim Kulübü; insansız hava araçları, otonom sistemler ve dijital üretim üzerine çalışır. Üç büyük projemiz: CNC, Hera ve VTOL.","Der Turan-Club arbeitet an unbemannten Luftfahrzeugen, autonomen Systemen und digitaler Fertigung. Drei Großprojekte: CNC, Hera und VTOL.","The Turan club works on unmanned aircraft, autonomous systems and digital fabrication. Three major projects: CNC, Hera and VTOL."],
hs:["4 eksenli CNC sıcak tel kesim sistemi","4-Achsen-CNC-Heißdraht-Schneidsystem","4-axis CNC hot-wire cutting system"],
hpar:["Hera, ısıtılmış bir tel ile köpük malzemeyi milimetrik hassasiyetle kesen CNC makinemizdir. Kanat profilleri ve gövde kalıpları gibi İHA parçalarını üretmek için tasarlandı. Telin iki ucunu, birbirinden bağımsız hareket eden iki ayrı 4 eksenli ünite taşır; böylece konik kanatlar ve karmaşık kesitler tek geçişte kesilebilir.","Hera ist unsere CNC-Maschine, die Schaumstoff mit einem erhitzten Draht präzise schneidet. Sie fertigt UAV-Teile wie Flügelprofile und Rumpfformen. Die beiden Drahtenden werden von zwei unabhängigen 4-Achsen-Einheiten geführt, sodass auch konische Flügel und komplexe Querschnitte in einem Durchgang entstehen.","Hera is our CNC machine that cuts foam with a heated wire at millimetre precision. It is designed to produce UAV parts such as wing profiles and fuselage moulds. Each end of the wire is carried by its own independent 4-axis unit, so tapered wings and complex cross-sections can be cut in a single pass."],
hk1:["2 bağımsız ünite","2 unabhängige Einheiten","2 independent units"],hk2:["Ünite başına 4 eksen","4 Achsen je Einheit","4 axes per unit"],hk3:["Isıtmalı tel","Heizdraht","Heated wire"],hk4:["Köpük kesimi","Schaumschnitt","Foam cutting"],
vs:["Sabit kanatlı dikey kalkış-iniş uçağı","Starrflügel-Senkrechtstarter","Fixed-wing vertical take-off aircraft"],
vpar:["VTOL, dronun en güçlü yanı olan dikey kalkış ve havada asılı kalma yeteneğini, uçağın uzun menzilli ve verimli uçuşuyla tek platformda birleştirir. Kalkışta motorlar yukarı bakar; araç hız kazanınca motorlar öne döner ve kanatlar taşımayı üstlenir.","VTOL vereint die Stärke der Drohne, senkrecht zu starten und zu schweben, mit der Reichweite und Effizienz eines Flugzeugs. Beim Start zeigen die Motoren nach oben; mit zunehmender Geschwindigkeit schwenken sie nach vorn und die Flügel übernehmen den Auftrieb.","VTOL combines the drone's strength, vertical take-off and hovering, with the range and efficiency of an aircraft. At take-off the motors point up; as speed builds they tilt forward and the wings take over the lift."],
vk1:["Pistsiz kalkış","Start ohne Piste","No runway needed"],vk2:["Uzun menzil","Große Reichweite","Long range"],vk3:["Kanatla taşıma","Flügelauftrieb","Wing-borne cruise"],vk4:["Enerji verimliliği","Energieeffizienz","Energy efficient"],
re:["Demiröz Robotics","Demiröz Robotics","Demiröz Robotics"],rh:["Yarışmak için inşa ediyoruz.","Wir bauen, um zu gewinnen.","We build to compete."],
rp:["Ulusal ve uluslararası robot yarışmaları için robotlar tasarlıyor, programlıyor ve sahaya çıkarıyoruz.","Wir entwerfen und programmieren Roboter für nationale und internationale Wettbewerbe und bringen sie aufs Spielfeld.","We design and program robots for national and international competitions, and take them onto the field."],
vx:["Kompakt, hızlı ve hassas. VEX yarışma sahası için geliştirdiğimiz robotlarla mekanik tasarım, sensörler ve otonom yazılım üzerinde çalışıyoruz.","Kompakt, schnell, präzise. Mit unseren VEX-Robotern arbeiten wir an Mechanik, Sensorik und autonomer Software.","Compact, fast and precise. With our VEX robots we work on mechanical design, sensors and autonomous software."],
fx:["Daha büyük ölçek, daha sıkı takım çalışması. Sezon oyununa göre tasarlanan büyük FRC robotlarıyla mühendislik sürecini ve proje yönetimini deneyimliyoruz.","Größerer Maßstab, engere Teamarbeit. Mit großen FRC-Robotern erleben wir den Ingenieurprozess und das Projektmanagement.","Bigger scale, tighter teamwork. Building large FRC robots for each season's game, we practise the full engineering process and project management."],
ae:["Agrotech · Okul 2030","Agrotech · Schule 2030","Agrotech · School 2030"],ah:["Sürdürülebilir gelecek için tarım, teknoloji ve yaşam.","Landwirtschaft, Technik und Leben für eine nachhaltige Zukunft.","Agriculture, technology and life for a sustainable future."],
ap:["Agrotech, tarımı teknolojiyle buluşturan çevresel projeler yürütür: su, enerji, atık ve üretim.","Agrotech führt Umweltprojekte, die Landwirtschaft und Technik verbinden: Wasser, Energie, Abfall und Produktion.","Agrotech runs environmental projects that bring agriculture and technology together: water, energy, waste and production."],
sh:["Agrotech Sera Projesi","Agrotech-Gewächshausprojekt","Agrotech Greenhouse Project"],
sp:["Okul serasının altyapısını geliştirmeyi, üretim kapasitesini artırmayı ve daha fazla öğrenciye tarım, sürdürülebilirlik ve doğa bilinci kazandırmayı hedefliyoruz. Her destek, geleceğe ve sürdürülebilir bir doğa anlayışına yapılan yatırımdır.","Wir wollen die Infrastruktur des Schulgewächshauses ausbauen, die Produktion steigern und mehr Schülerinnen und Schülern Wissen über Landwirtschaft, Nachhaltigkeit und Natur vermitteln. Jede Unterstützung ist eine Investition in die Zukunft.","We aim to upgrade the school greenhouse, raise its production capacity and teach more students about agriculture, sustainability and nature. Every contribution is an investment in the future."],

function vis(c,draw){const x=c.getContext('2d');let on=false,run=false,last=0,t=0;
new IntersectionObserver(e=>{on=e[0].isIntersecting;if(on&&!run){run=true;last=performance.now();requestAnimationFrame(f)}},{threshold:.05}).observe(c);
function f(n){if(!on){run=false;return}const dt=Math.min(.05,(n-last)/1000);last=n;t+=dt;draw(x,t,dt,c.width,c.height);requestAnimationFrame(f)}}
const cl=(v,a,b)=>Math.max(a,Math.min(b,v)),ez=v=>{v=cl(v,0,1);return v*v*(3-2*v)};
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;

/* --- CNC hot-wire (isometric, physically traced airfoil cut) --- */
(()=>{const c=document.querySelector('[data-v=cnc]');if(!c)return;
const P=(a,b,h)=>[400+(a-b)*.95,285+(a+b)*.45-h];
const pts=[],N=90;for(let i=0;i<=N;i++){const q=i/N,yt=.3*5*.15*200*(.2969*Math.sqrt(q)-.126*q-.3516*q*q+.2843*q**3-.1015*q**4);pts.push([-100+200*q,-yt])}
for(let i=N;i>=0;i--){pts.push([pts[i][0],-pts[i][1]])}
const dots=[];for(let i=0;i<260;i++)dots.push([-120+rnd()*240,-60+rnd()*120]);
const vap=[];
const poly=(x,arr,fill)=>{x.beginPath();arr.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();x.fillStyle=fill;x.fill()};
vis(c,(x,t,dt,W,H)=>{const T=t%12,p=ez(cl(T/9.5,0,1)),fade=T>11?(T-11):0;
const bg=x.createRadialGradient(400,200,40,400,220,520);bg.addColorStop(0,'#ffffff');bg.addColorStop(1,'#dfe5ed');x.fillStyle=bg;x.fillRect(0,0,W,H);
poly(x,[P(-190,-120,0),P(190,-120,0),P(190,120,0),P(-190,120,0)],'#c3ccd8');
x.strokeStyle='#aeb8c6';x.lineWidth=1;for(let i=-180;i<=180;i+=30){x.beginPath();x.moveTo(...P(i,-120,0));x.lineTo(...P(i,120,0));x.stroke()}
const g=x.createRadialGradient(400,330,10,400,330,200);g.addColorStop(0,'rgba(0,0,0,.25)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(150,230,500,200);
const H0=70;
poly(x,[P(-120,60,0),P(120,60,0),P(120,60,H0),P(-120,60,H0)],'#dbe6f2');
poly(x,[P(120,-60,0),P(120,60,0),P(120,60,H0),P(120,-60,H0)],'#a3b6cb');
poly(x,[P(-120,-60,H0),P(120,-60,H0),P(120,60,H0),P(-120,60,H0)],'#eef3f8');
x.fillStyle='rgba(120,140,160,.28)';dots.forEach(d=>{const q=P(d[0],d[1],H0);x.fillRect(q[0],q[1],1.6,1.1)});
const idx=Math.floor(p*(pts.length-1));
x.lineJoin='round';x.lineCap='round';
if(idx>1){x.beginPath();for(let i=0;i<=idx;i++){const q=P(pts[i][0],pts[i][1],H0);i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1])}x.strokeStyle='#4a5560';x.lineWidth=3.2;x.stroke();x.strokeStyle='rgba(255,170,90,.35)';x.lineWidth=1;x.stroke()}
const u=pts[idx][0],v=pts[idx][1],top=P(u,v,135),bot=P(u,v,2),hit=P(u,v,H0),col=P(-175,-112,0);
const arm=(a,b,w)=>{const gr=x.createLinearGradient(a[0],a[1]-w,a[0],a[1]+w);gr.addColorStop(0,'#c7c7cc');gr.addColorStop(.5,'#7c7c82');gr.addColorStop(1,'#3a3a3f');x.strokeStyle=gr;x.lineWidth=w;x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.stroke()};
const ct=P(-175,-112,150),cb=P(-175,-112,0);
const cg=x.createLinearGradient(ct[0]-9,0,ct[0]+9,0);cg.addColorStop(0,'#4b4b50');cg.addColorStop(.4,'#b8b8bd');cg.addColorStop(1,'#37373b');x.fillStyle=cg;x.fillRect(ct[0]-9,ct[1],18,cb[1]-ct[1]);
arm(P(-175,-112,135),top,7);arm(P(-175,-112,6),bot,7);
x.save();x.shadowColor='#ff7a2a';x.shadowBlur=14;x.strokeStyle='#ffc9a0';x.lineWidth=1.6;x.beginPath();x.moveTo(top[0],top[1]);x.lineTo(bot[0],bot[1]);x.stroke();x.restore();
const gl=x.createRadialGradient(hit[0],hit[1],0,hit[0],hit[1],26);gl.addColorStop(0,'rgba(255,150,70,.9)');gl.addColorStop(1,'rgba(255,100,30,0)');x.fillStyle=gl;x.fillRect(hit[0]-30,hit[1]-30,60,60);
if(p<1)for(let i=0;i<2;i++)vap.push({x:hit[0]+(rnd()-.5)*4,y:hit[1],vx:(rnd()-.5)*8,vy:-18-rnd()*20,l:0});
for(let i=vap.length-1;i>=0;i--){const q=vap[i];q.l+=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx+=(rnd()-.5)*20*dt;if(q.l>2.4){vap.splice(i,1);continue}x.fillStyle='rgba(120,132,148,'+(.16*(1-q.l/2.4))+')';x.beginPath();x.arc(q.x,q.y,3+q.l*7,0,7);x.fill()}
if(fade){x.fillStyle='rgba(236,240,246,'+fade+')';x.fillRect(0,0,W,H)}
})})();

/* --- Hera: neural network, signals travelling layer to layer --- */
(()=>{const c=document.querySelector('[data-v=ai]');if(!c)return;
const L=[4,6,7,5,3],nodes=[];L.forEach((n,l)=>{const row=[];for(let i=0;i<n;i++)row.push({l,i,x:110+l*145,y:60+(i+.5)*(300/n),z:.6+rnd()*.8,pulse:0});nodes.push(row)});
const sig=[];for(let i=0;i<16;i++)sig.push({a:nodes[0][i%4],b:nodes[1][(i*3)%6],p:rnd()});
vis(c,(x,t,dt,W,H)=>{const bg=x.createRadialGradient(400,200,30,400,220,480);bg.addColorStop(0,'#ffffff');bg.addColorStop(1,'#e3e9f1');x.fillStyle=bg;x.fillRect(0,0,W,H);
const ox=Math.sin(t*.4)*14,oy=Math.cos(t*.3)*8,pos=n=>[n.x+ox*n.z,n.y+oy*n.z];
x.lineWidth=1;nodes.forEach((row,l)=>{if(l==L.length-1)return;row.forEach(a=>nodes[l+1].forEach(b=>{const A=pos(a),B=pos(b);x.strokeStyle='rgba(0,80,200,'+(.08+.3*Math.max(a.pulse,b.pulse))+')';x.beginPath();x.moveTo(A[0],A[1]);x.lineTo(B[0],B[1]);x.stroke()}))});
sig.forEach(s=>{s.p+=dt*(.55+.2*s.a.z);if(s.p>=1){s.b.pulse=1;const l=s.b.l;if(l>=L.length-1){s.a=nodes[0][Math.floor(rnd()*L[0])];s.b=nodes[1][Math.floor(rnd()*L[1])]}else{s.a=s.b;s.b=nodes[l+1][Math.floor(rnd()*L[l+1])]}s.p=0}
const A=pos(s.a),B=pos(s.b),px=A[0]+(B[0]-A[0])*s.p,py=A[1]+(B[1]-A[1])*s.p,tx=A[0]+(B[0]-A[0])*Math.max(0,s.p-.12),ty=A[1]+(B[1]-A[1])*Math.max(0,s.p-.12);
const gr=x.createLinearGradient(tx,ty,px,py);gr.addColorStop(0,'rgba(0,113,227,0)');gr.addColorStop(1,'rgba(0,113,227,.95)');x.strokeStyle=gr;x.lineWidth=2;x.beginPath();x.moveTo(tx,ty);x.lineTo(px,py);x.stroke()});
nodes.forEach(row=>row.forEach(n=>{n.pulse=Math.max(0,n.pulse-dt*1.4);const q=pos(n),r=4.5*n.z+n.pulse*5;
if(n.pulse>.02){const g=x.createRadialGradient(q[0],q[1],0,q[0],q[1],r*4);g.addColorStop(0,'rgba(0,113,227,'+.6*n.pulse+')');g.addColorStop(1,'rgba(0,113,227,0)');x.fillStyle=g;x.fillRect(q[0]-r*4,q[1]-r*4,r*8,r*8)}
x.fillStyle='rgba(40,48,60,'+(.55+.4*n.pulse)+')';x.beginPath();x.arc(q[0],q[1],r,0,7);x.fill()}));
x.font='600 13px -apple-system,Inter,sans-serif';x.fillStyle='rgba(0,0,0,.4)';x.textAlign='left';x.fillText('H E R A',24,H-22)})})();

/* --- VTOL: spin-up, vertical climb, rotors tilt, forward flight --- */
(()=>{const c=document.querySelector('[data-v=vtol]');if(!c)return;
let dist=0;const gm=[];for(let i=0;i<14;i++)gm.push(rnd()*800);
vis(c,(x,t,dt,W,H)=>{const T=t%13,gy=360,spin=ez((T-.2)/1.8),alt=ez((T-2)/3)*150,tilt=ez((T-5)/2.4),spd=ez((T-5.6)/3),fade=T>11.8?(T-11.8)/1.2:0;
dist+=dt*spd*520;
const sk=x.createLinearGradient(0,0,0,gy);sk.addColorStop(0,'#f6f9fd');sk.addColorStop(1,'#c6dbf0');x.fillStyle=sk;x.fillRect(0,0,W,gy);
x.fillStyle='#dde3ea';x.fillRect(0,gy,W,H-gy);x.fillStyle='rgba(0,0,0,.12)';x.fillRect(0,gy,W,1);
x.fillStyle='rgba(0,0,0,.14)';gm.forEach((m,i)=>{const px=((m-dist*(1+i%3*.35))%900+900)%900-50,len=20+spd*70,y=gy+14+(i%5)*13;x.fillRect(px,y,len,1.5)});
const cx=330,cy=gy-40-alt;
const sh=x.createRadialGradient(cx,gy+10,2,cx,gy+10,150);sh.addColorStop(0,'rgba(0,0,0,'+(.6-alt/300)+')');sh.addColorStop(1,'rgba(0,0,0,0)');x.save();x.translate(0,0);x.scale(1,.18);x.fillStyle=sh;x.fillRect(cx-160,(gy+10-150)/.18,320,300/.18);x.restore();
if(alt<70&&spin>.4){const d=x.createRadialGradient(cx,gy+4,5,cx,gy+4,220);d.addColorStop(0,'rgba(180,185,190,'+(.22*spin*(1-alt/70))+')');d.addColorStop(1,'rgba(180,185,190,0)');x.save();x.scale(1,.2);x.fillStyle=d;x.fillRect(cx-230,(gy-40)/.2,460,100/.2);x.restore()}
x.save();x.translate(cx,cy);x.rotate(-.05*spd);
const rot=(mx,my,dark)=>{const hub=[mx,my-12];x.strokeStyle=dark?'#5a5a60':'#9a9aa0';x.lineWidth=3;x.beginPath();x.moveTo(mx,my);x.lineTo(hub[0],hub[1]);x.stroke();
x.save();x.translate(hub[0],hub[1]);x.rotate(tilt*Math.PI/2);
const ph=t*40*spin,ry=5;x.fillStyle='rgba(0,0,0,'+(.08*spin)+')';x.beginPath();x.ellipse(0,0,46,ry,0,0,7);x.fill();
x.strokeStyle='rgba(0,0,0,'+(.2*spin)+')';x.lineWidth=1;x.stroke();
const k=Math.cos(ph);x.strokeStyle=dark?'#303034':'#1c1c1e';x.lineWidth=2.5;x.globalAlpha=1-.7*spin;x.beginPath();x.moveTo(-46*k,0);x.lineTo(46*k,0);x.stroke();x.globalAlpha=1;
x.fillStyle=dark?'#4a4a50':'#d1d1d6';x.beginPath();x.arc(0,0,3.6,0,7);x.fill();x.restore()};
x.strokeStyle='#58585d';x.lineWidth=5;x.lineCap='round';x.beginPath();x.moveTo(-60,-26);x.lineTo(95,-26);x.stroke();
rot(-60,-26,1);rot(95,-26,1);
x.fillStyle='#8e8e93';x.beginPath();x.moveTo(-10,-5);x.lineTo(42,-5);x.lineTo(70,-34);x.lineTo(40,-34);x.closePath();x.fill();
x.fillStyle='#707075';x.beginPath();x.moveTo(-120,-8);x.lineTo(-92,-8);x.lineTo(-106,-52);x.lineTo(-126,-52);x.closePath();x.fill();
const fg=x.createLinearGradient(0,-24,0,22);fg.addColorStop(0,'#7f8998');fg.addColorStop(.5,'#48505c');fg.addColorStop(1,'#23272e');x.fillStyle=fg;
x.beginPath();x.moveTo(-132,-6);x.bezierCurveTo(-60,-30,60,-30,134,-2);x.bezierCurveTo(110,20,-60,24,-132,-6);x.fill();
x.fillStyle='rgba(20,30,45,.85)';x.beginPath();x.moveTo(70,-14);x.bezierCurveTo(88,-18,106,-12,116,-6);x.lineTo(74,-5);x.closePath();x.fill();
x.fillStyle='#8f97a3';x.beginPath();x.moveTo(-10,6);x.lineTo(46,6);x.lineTo(78,36);x.lineTo(44,36);x.closePath();x.fill();
x.fillStyle='#b3bac4';x.beginPath();x.moveTo(-8,6);x.lineTo(46,6);x.lineTo(50,10);x.lineTo(-8,10);x.closePath();x.fill();
x.strokeStyle='#8e8e93';x.lineWidth=5;x.beginPath();x.moveTo(-60,28);x.lineTo(95,28);x.stroke();
rot(-60,28,0);rot(95,28,0);
x.fillStyle='#e5322b';x.fillRect(-100,-3,14,3);
x.restore();
if(fade){x.fillStyle='rgba(236,240,246,'+fade+')';x.fillRect(0,0,W,H)}
})})();
